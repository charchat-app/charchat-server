[project]
name = "charchat-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    # 이미지 업로드(multipart/form-data) 수신. FastAPI UploadFile에 필요하다(CREATE-US-06).
    "python-multipart>=0.0.9",
    # BASE-03 이메일 로그인: 비밀번호 해시(BCrypt, cost 12)와 액세스 토큰(JWT HS256).
    "bcrypt>=4.2",
    "PyJWT>=2.9",
    # CREATE-US-08 Jev HTTP 전송(등급 검토·공통 안전 판정을 설정으로 켤 때만 쓴다).
    # 테스트 클라이언트(fastapi.testclient)도 이 의존성을 쓴다.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["app_integration: 별도 앱 체크아웃과 연결하는 로컬 계약 검사"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",  # 기본 스타일 오류
    "F",  # 미사용 import, 정의되지 않은 이름 등 실수
    "I",  # import 정렬
    "B",  # 흔한 파이썬 함정
]

[tool.ruff.format]
quote-style = "double"

# pip install -e . 에서 app 패키지만 설치한다(tests·scripts 제외).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
