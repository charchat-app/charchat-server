[project]
name = "charchat-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",  # 기본 스타일 오류
    "F",  # 미사용 import, 정의되지 않은 이름 등 실수
    "I",  # import 정렬
    "B",  # 흔한 파이썬 함정
]

[tool.ruff.format]
quote-style = "double"
