[project]
name = "charchat-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["app_integration: 별도 앱 체크아웃과 연결하는 로컬 계약 검사"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",  # 기본 스타일 오류
    "F",  # 미사용 import, 정의되지 않은 이름 등 실수
    "I",  # import 정렬
    "B",  # 흔한 파이썬 함정
]

[tool.ruff.format]
quote-style = "double"

# pip install -e . 에서 app 패키지만 설치한다(migrations·scripts 제외).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
